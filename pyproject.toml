[project]
name = "grepchopflip"
version = "0.1.0.dev0"
description = "grep | chop | flip: turn one song into a library of well-cut, labeled samples with a JSON index. Built for agents to call."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]   # LICENSES/: Apache-2.0 text for code adapted from AudioCommons
requires-python = ">=3.12,<3.13"
authors = [{ name = "Bob" }]
keywords = ["audio", "samples", "stem-separation", "beat-making", "cli", "agent"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "typer>=0.27,<0.28",
  "rich>=15,<16",
  "numpy>=2,<3",
  "torch>=2.14,<2.15",
  "torchaudio>=2.11",
  "audio-separator>=0.47,<0.48",
  "soundfile>=0.13",
  # audio-separator imports onnxruntime at module load but only declares it as an extra; the CPU build
  # is enough because Demucs and MDX23C run on torch (onnxruntime only serves legacy MDX-Net .onnx models).
  "onnxruntime>=1.17",
  # audio-separator imports audioread (spec_utils) but does not declare it.
  "audioread>=3.1.0",
  "beat-this>=1.1,<2",
  "librosa>=0.11",
  "scipy>=1.11",
  "auditok>=0.5.2",
  "pyloudnorm>=0.2.0",
  "jsonschema>=4.26.0",
]

[project.optional-dependencies]
# Optional extras (D-002: the core stays MIT and light; anything non-MIT or heavy is opt-in and labeled).
words = [
  "faster-whisper>=1.1",
  "nvidia-cublas-cu12; sys_platform == 'linux'",
  "nvidia-cudnn-cu12; sys_platform == 'linux'",
]
notes = ["muscriptor"]         # weights are CC BY-NC 4.0 (non-commercial); gcf prints a notice on first use
# `gcf enrich` extras (D-041): AST instrument tags (BSD-3-Clause weights) and CLAP embeddings (Apache-2.0
# weights). Both run on torch from the core; weights come from Hugging Face via `gcf models pull`.
tag = ["transformers>=5,<6"]
embed = ["transformers>=5,<6"]

[project.scripts]
gcf = "grepchopflip.cli:app"

[project.urls]
Homepage = "https://github.com/grepchopflip/grepchopflip"

[dependency-groups]
dev = [
  "pytest>=8",
  "wavinfo>=2",                # independent reader for the smpl chunk round-trip test
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "grepchopflip"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device"]
