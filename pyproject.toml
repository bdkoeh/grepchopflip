[project]
name = "grepchopflip"
version = "0.1.0.dev0"
description = "grep | chop | flip: turn one song into a library of well-cut, labeled samples with a JSON index. Built for agents to call."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Bob" }]
keywords = ["audio", "samples", "stem-separation", "beat-making", "cli", "agent"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "typer>=0.27,<0.28",
  "rich>=15,<16",
  "numpy>=2,<3",
  "torch>=2.14,<2.15",
  "torchaudio>=2.11",
  "audio-separator>=0.47,<0.48",
  "soundfile>=0.13",
  # audio-separator imports onnxruntime at module load but only declares it as an extra; the CPU build
  # is enough because Demucs and MDX23C run on torch (onnxruntime only serves legacy MDX-Net .onnx models).
  "onnxruntime>=1.17",
  # audio-separator needs `diffq` on Linux, which has no wheels and fails to build without a C compiler.
  # `diffq-fixed` ships the same `diffq` module with a manylinux cp312 wheel.
  "diffq-fixed>=0.2.4",
  "audioread>=3.1.0",
]

[project.scripts]
gcf = "grepchopflip.cli:app"

[project.urls]
Homepage = "https://github.com/grepchopflip/grepchopflip"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Applies to local/dev resolution only; installs from PyPI (uv tool install) still pull `diffq`
# transitively and need a C compiler unless the user installs diffq-fixed first.
override-dependencies = ["diffq; sys_platform == 'never'"]

[tool.uv.build-backend]
module-name = "grepchopflip"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device"]
